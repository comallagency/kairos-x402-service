[project]
name = "agentindex-x402"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "x402[extensions]==2.22.0",
    "cdp-sdk",
    "cursor-sdk",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
    "pydantic-settings",
    "email-validator",
    "fastmcp==4.0.3",
    "pyyaml",
    "trafilatura",
    "pypdf",
    "pymupdf4llm",
    "jsonschema",
    "jsonpath-ng",
    "jsonpath-ng",
    "py3langid",
    "tiktoken",
    "anthropic>=1.12.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
