services:
  x402_blue:
    build: .
    image: x402-app:latest
    container_name: x402-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - x402_net
    env_file:
      - .env
    environment:
      BASE_URL: https://x402.agentindex.world
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Read-only, for GET /admin/live's real per-route p50 latency (2026-09-29) -
      # nginx's own $request_time, the same field scripts/ingest_daily_nginx_stats.py
      # already uses for the daily dashboard. group_add below (GID 4 = adm on
      # the host) is needed because these files are www-data:adm mode 640 -
      # appuser has no read access otherwise, and adding it wasn't going to
      # happen by loosening host permissions.
      - /var/log/nginx:/var/log/nginx-host:ro
    group_add:
      - "4"  # adm, see the nginx log mount above
    ports:
      - "127.0.0.1:18402:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  x402_green:
    build: .
    image: x402-app:latest
    container_name: x402-app-green
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - x402_net
    env_file:
      - .env
    environment:
      BASE_URL: https://x402.agentindex.world
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Read-only, for GET /admin/live's real per-route p50 latency (2026-09-29) -
      # nginx's own $request_time, the same field scripts/ingest_daily_nginx_stats.py
      # already uses for the daily dashboard. group_add below (GID 4 = adm on
      # the host) is needed because these files are www-data:adm mode 640 -
      # appuser has no read access otherwise, and adding it wasn't going to
      # happen by loosening host permissions.
      - /var/log/nginx:/var/log/nginx-host:ro
    group_add:
      - "4"  # adm, see the nginx log mount above
    ports:
      - "127.0.0.1:18403:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Read-only analytics dashboard (2026-09-30) - a fully separate
  # container, no modification to x402-app itself. requests.db is mounted
  # :ro (whole ./data dir, not just the file, so WAL's companion -wal/-shm
  # files stay visible for a correct read - db.py already runs in WAL
  # mode, which is what lets this read concurrently with x402-app's own
  # writes without ever blocking either side - see grafana/README or the
  # 2026-09-30 batch commit for the real concurrent-load verification).
  # frser-sqlite-datasource is a community (unsigned) plugin, hence the
  # explicit allow-unsigned env var below - without it Grafana refuses to
  # load it at all.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: x402-grafana
    restart: unless-stopped
    env_file:
      - .env.grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://x402.agentindex.world/admin/analytics/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: frser-sqlite-datasource
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      - ./data:/var/lib/grafana-data:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

networks:
  x402_net:
    external: true

volumes:
  grafana-storage:
