services:
  x402:
    build: .
    image: x402-app:latest
    container_name: x402-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - x402_net
    env_file:
      - .env
    environment:
      BASE_URL: https://x402.agentindex.world
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:18402:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  x402_net:
    external: true
