server {
    listen 80;
    listen [::]:80;
    server_name x402.agentindex.world;

    location /.well-known/acme-challenge/ {
        root /var/www/x402-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name x402.agentindex.world;

    ssl_certificate     /etc/letsencrypt/live/x402.agentindex.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x402.agentindex.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18402;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10;
    }
}
